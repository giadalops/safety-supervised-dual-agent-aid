[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-agent-aid-reference"
version = "0.1.0"
description = "Official reference implementation of safety-supervised dual-agent AID"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "sb3-contrib>=2.3"]
test = ["pytest>=8"]

[project.scripts]
dual-aid-train = "dual_agent_aid.train:main"

[tool.setuptools.packages.find]
where = ["src"]
